name: Publish PlexonClaimFlags 1.0.0

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-1.0.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source project
        shell: bash
        run: |
          mkdir -p /tmp/plexon-release
          cat .build/source.part00 .build/source.part01 .build/source.part02 .build/source.part03 .build/source.part04 | base64 --decode > /tmp/PlexonClaimFlags-source.zip
          unzip -q /tmp/PlexonClaimFlags-source.zip -d /tmp/plexon-release
          test -f /tmp/plexon-release/PlexonClaimFlags/build.gradle.kts

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Build release JAR
        working-directory: /tmp/plexon-release/PlexonClaimFlags
        run: gradle clean build --stacktrace

      - name: Verify release JAR
        shell: bash
        run: |
          JAR=/tmp/plexon-release/PlexonClaimFlags/build/libs/PlexonClaimFlags-1.0.0.jar
          test -f "$JAR"
          unzip -p "$JAR" plugin.yml | grep -F "version: 1.0.0"
          sha256sum "$JAR"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          JAR=/tmp/plexon-release/PlexonClaimFlags/build/libs/PlexonClaimFlags-1.0.0.jar
          cat > /tmp/release-notes.md <<'EOF'
          # PlexonClaimFlags 1.0.0

          Initial release of the Plexon GriefPrevention claim-flags addon for Paper 26.2.

          ## Highlights
          - `/claimsflags` interactive claim protection GUI.
          - Supports main claims and GriefPrevention subdivisions.
          - Per-subclaim inheritance and explicit overrides.
          - Flags for natural mobs, spawner mobs, PvP, building, interactions, containers, explosions, fire, crop trampling, and mob griefing.
          - Persistent settings keyed to GriefPrevention claim IDs.
          - Runtime flag checks use in-memory data to avoid disk reads during gameplay events.

          ## Requirements
          - Paper 26.2
          - Java 25
          - GriefPrevention 16.18.7+

          This JAR is built in GitHub Actions against the real Paper 26.2 and GriefPrevention dependencies.
          EOF

          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 "$JAR" --clobber
          else
            gh release create v1.0.0 "$JAR" \
              --title "PlexonClaimFlags 1.0.0" \
              --notes-file /tmp/release-notes.md \
              --target "$GITHUB_SHA"
          fi
